<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Systems // Interface</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg-color: #00020c;
  --primary-glow: #00e5ff;
  --secondary-glow: #ff00c1;
  --text-color: #e0e0e0;
}
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  background-color: var(--bg-color);
  font-family: 'Share Tech Mono', monospace;
  color: var(--text-color);
}

/* --- Core Layout & Canvas --- */
#neural-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  opacity: 0.6;
}

.main-container {
  height: 100%;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  perspective: 1000px;
}

/* --- Content States --- */
.content-wrapper {
  text-align: center;
  transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
}

/* Hide chat by default */
#chat-interface {
  opacity: 0;
  transform: translateZ(50px);
  pointer-events: none;
  position: absolute;
  width: clamp(300px, 90%, 700px);
  height: 70vh;
  display: flex;
  flex-direction: column;
}

/* Hide hero when chat is active */
body.chat-active #hero-content {
  opacity: 0;
  transform: translateZ(-50px);
  pointer-events: none;
}
/* Show chat when chat is active */
body.chat-active #chat-interface {
  opacity: 1;
  transform: translateZ(0);
  pointer-events: auto;
}

/* --- Hero Content & Glitch Effect --- */
#hero-content h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(2.5rem, 8vw, 6rem);
  font-weight: 900;
  color: #fff;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  position: relative;
  text-shadow: 0 0 10px var(--primary-glow), 0 0 20px var(--primary-glow), 0 0 40px var(--primary-glow);
}

.glitch {
  position: relative;
  display: inline-block;
}
.glitch::before,
.glitch::after {
  content: attr(data-text);
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--bg-color);
  overflow: hidden;
  clip: rect(0, 900px, 0, 0);
}
.glitch::before {
  left: 2px;
  text-shadow: -2px 0 var(--secondary-glow);
  animation: glitch-anim-1 2s infinite linear alternate-reverse;
}
.glitch::after {
  left: -2px;
  text-shadow: -2px 0 var(--primary-glow), 2px 2px var(--secondary-glow);
  animation: glitch-anim-2 2s infinite linear alternate-reverse;
}
@keyframes glitch-anim-1 { 0% { clip: rect(42px, 9999px, 44px, 0); } 100% { clip: rect(12px, 9999px, 98px, 0); } }
@keyframes glitch-anim-2 { 0% { clip: rect(40px, 9999px, 100px, 0); } 100% { clip: rect(5px, 9999px, 85px, 0); } }

#hero-content p {
  margin-top: 1rem;
  font-size: 1.1rem;
  color: #a9a9a9;
  letter-spacing: 0.05em;
}

#engage-btn {
  font-family: 'Share Tech Mono', monospace;
  margin-top: 2.5rem;
  padding: 1rem 2.5rem;
  font-size: 1.2rem;
  color: var(--primary-glow);
  background-color: transparent;
  border: 2px solid var(--primary-glow);
  border-radius: 4px;
  cursor: pointer;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  transition: background-color 0.3s, color 0.3s, text-shadow 0.3s;
  box-shadow: inset 0 0 10px var(--primary-glow), 0 0 10px var(--primary-glow);
}
#engage-btn:hover {
  background-color: var(--primary-glow);
  color: var(--bg-color);
  text-shadow: 0 0 5px var(--bg-color);
}

/* --- Chat Interface --- */
.chat-messages {
  flex-grow: 1;
  overflow-y: auto;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 5%, black 95%, transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, black 5%, black 95%, transparent 100%);
}
.chat-messages::-webkit-scrollbar { display: none; }
.chat-messages { scrollbar-width: none; }

.message {
  max-width: 80%;
  padding: 0.5rem 0; /* Minimal padding */
  line-height: 1.6;
  background: none;
  border: none;
  animation: textFadeIn 0.5s ease;
}
@keyframes textFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.message.user { margin-left: auto; text-align: right; color: var(--primary-glow); }
.message.bot { margin-right: auto; }
.message::before {
  content: attr(data-sender) " > ";
  opacity: 0.7;
}

.chat-input-area {
  display: flex;
  padding: 1rem 0;
  border-top: 1px solid rgba(0, 229, 255, 0.2);
}
#user-input {
  flex-grow: 1;
  background: transparent;
  border: none;
  outline: none;
  color: #fff;
  font-family: 'Share Tech Mono', monospace;
  font-size: 1.1rem;
  padding: 0.5rem;
}
#user-input::placeholder { color: rgba(255, 255, 255, 0.4); }

#send-btn {
  background: none;
  border: none;
  color: var(--primary-glow);
  font-family: 'Share Tech Mono', monospace;
  font-size: 1.1rem;
  cursor: pointer;
  padding: 0.5rem;
  transition: color 0.2s, text-shadow 0.2s;
}
#send-btn:hover { color: #fff; text-shadow: 0 0 8px var(--primary-glow); }

</style>
</head>
<body>

<canvas id="neural-canvas"></canvas>

<div class="main-container">

  <div id="hero-content" class="content-wrapper">
    <h1 class="glitch" data-text="NOVA SYSTEMS">NOVA SYSTEMS</h1>
    <p>Generative AI Consciousness // Godwin Austen Labs</p>
    <button id="engage-btn">Initiate Contact</button>
  </div>

  <div id="chat-interface" class="content-wrapper">
    <div id="chat-log" class="chat-messages">
      <div class="message bot" data-sender="NOVA">Authentication complete. I am online and ready.</div>
    </div>
    <div class="chat-input-area">
      <input id="user-input" type="text" placeholder="Transmit command..." autocomplete="off"/>
      <button id="send-btn">Send</button>
    </div>
  </div>

</div>

<script>
// --- UI TRANSITION LOGIC ---
const engageBtn = document.getElementById('engage-btn');
engageBtn.addEventListener('click', () => {
  document.body.classList.add('chat-active');
});

// --- CHAT LOGIC ---
const WORKER_URL = "http://localhost:8787"; // Your worker URL
const chatLog = document.getElementById('chat-log');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

function appendMessage(text, sender) {
  const msg = document.createElement('div');
  msg.classList.add('message', sender);
  msg.setAttribute('data-sender', sender === 'user' ? 'USER' : 'NOVA');
  
  const textNode = document.createTextNode(text);
  msg.appendChild(textNode);
  
  chatLog.appendChild(msg);
  chatLog.scrollTop = chatLog.scrollHeight;
}

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text) return;
  appendMessage(text, 'user');
  userInput.value = '';
  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userPrompt: text })
    });
    if (!res.ok) {
      appendMessage(`Error: Connection refused by host [${res.status}]`, 'bot');
      return;
    }
    const data = await res.json();
    const reply = typeof data.result === 'string' ? data.result : JSON.stringify(data.result, null, 2);
    appendMessage(reply, 'bot');
  } catch (err) {
    appendMessage(`SYSTEM OFFLINE // ${err.message}`, 'bot');
  }
}
sendBtn.addEventListener('click', sendMessage);
userInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });


// --- GENERATIVE ART: REACTIVE NEURAL NETWORK ---
const canvas = document.getElementById('neural-canvas');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;
let particles = [];
const properties = {
    particleColor: `rgba(0, 229, 255, 1)`,
    particleRadius: 3,
    particleCount: w > 1024 ? 80 : 40,
    particleMaxVelocity: 0.5,
    lineLength: 150,
    mouseRadius: 200 // Radius of mouse interaction
};
const mouse = {
    x: null,
    y: null
};

window.addEventListener('resize', () => {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    properties.particleCount = w > 1024 ? 80 : 40;
});
document.body.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});
document.body.addEventListener('mouseout', () => {
    mouse.x = null;
    mouse.y = null;
});

class Particle {
    constructor() {
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.velocityX = (Math.random() * (properties.particleMaxVelocity * 2)) - properties.particleMaxVelocity;
        this.velocityY = (Math.random() * (properties.particleMaxVelocity * 2)) - properties.particleMaxVelocity;
    }
    position() {
        if (this.x + this.velocityX > w && this.velocityX > 0 || this.x + this.velocityX < 0 && this.velocityX < 0) {
            this.velocityX *= -1;
        }
        if (this.y + this.velocityY > h && this.velocityY > 0 || this.y + this.velocityY < 0 && this.velocityY < 0) {
            this.velocityY *= -1;
        }
        this.x += this.velocityX;
        this.y += this.velocityY;
    }
    reDraw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, properties.particleRadius, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fillStyle = properties.particleColor;
        ctx.fill();
    }
}

function drawLines() {
    let x1, y1, x2, y2, length, opacity;
    for (let i in particles) {
        for (let j in particles) {
            if (i === j) continue;
            x1 = particles[i].x;
            y1 = particles[i].y;
            x2 = particles[j].x;
            y2 = particles[j].y;
            length = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
            if (length < properties.lineLength) {
                opacity = 1 - length / properties.lineLength;
                ctx.lineWidth = '0.5';
                ctx.strokeStyle = `rgba(0, 229, 255, ${opacity})`;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.closePath();
                ctx.stroke();
            }
        }
    }
}

// Push mouse position as a "particle" to draw lines from
function drawMouseLines() {
    if (mouse.x === null) return;
    let x1, y1, length, opacity;
    for (let i in particles) {
        x1 = particles[i].x;
        y1 = particles[i].y;
        length = Math.sqrt(Math.pow(mouse.x - x1, 2) + Math.pow(mouse.y - y1, 2));

        if (length < properties.mouseRadius) {
            opacity = 1 - length / properties.mouseRadius;
            ctx.lineWidth = '0.8';
            ctx.strokeStyle = `rgba(255, 0, 193, ${opacity})`; // Secondary color for interaction
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.closePath();
            ctx.stroke();
        }
    }
}


function reDrawParticles() {
    for (let i in particles) {
        particles[i].position();
        particles[i].reDraw();
    }
}

function loop() {
    ctx.clearRect(0, 0, w, h);
    reDrawParticles();
    drawLines();
    drawMouseLines();
    requestAnimationFrame(loop);
}

function init() {
    for (let i = 0; i < properties.particleCount; i++) {
        particles.push(new Particle());
    }
    loop();
}
init();

</script>
</body>
</html>
